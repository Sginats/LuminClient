plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    // ForgeGradle 2.x (FG_2.3). Published to the Forge maven.
    // Apply via buildscript because FG2 predates the plugins {} resolution.
}

buildscript {
    repositories {
        mavenLocal()
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = "${mod_version}"
group = "${group}"
archivesBaseName = "${mod_id}"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'
compileJava.options.compilerArgs += ['-Xlint:all', '-Xlint:-deprecation']

minecraft {
    version = "${minecraft_version}-${forge_version}-${minecraft_version}"
    runDir = 'run'
    mappings = "${mcp_mappings}"
}

repositories {
    mavenLocal()
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    // Forge/Minecraft is provided by the `minecraft` block above.
    // No external runtime dependencies: everything uses JDK + Forge + Gson (bundled with MC).
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : "${mod_id}",
            'Specification-Vendor'  : 'Lumin',
            'Specification-Version' : '1',
            'Implementation-Title'  : "${mod_name}",
            'Implementation-Version': "${mod_version}",
            'Implementation-Vendor' : 'Lumin'
        ])
    }
}
